<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lipi</title>
    <style>
      body {
        margin: 0;
        background: #c0c0c0;
      }

      .controls {
        display: flex;
        gap: 5px;
        background-color: whitesmoke;
        margin-bottom: 10px;
        padding: 5px;
        position: sticky;
        top: 0;
      }

      .control {
        cursor: pointer;
      }

      canvas {
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <div class="control" id="newPage">📄</div>
      <div class="control" id="saveDrawing">💾</div>
      <input class="control" type="color" id="penColor" value="#000000" />
      <input
        class="control"
        type="range"
        id="brushSize"
        min="1"
        max="10"
        value="3"
      />
      <div class="control" id="pencilSelect">✏️</div>
      <div class="control" id="penSelect">✒️</div>
      <div class="control" id="brushSelect">🖌️</div>
      <div class="control" id="rubberSelect">⚪</div>
      <div class="control" id="undoAction">↩️</div>
      <div class="control" id="redoAction">⤴️</div>
      <div class="control" id="backBtn">⬅️</div>
      <div class="control" id="downloadBtn">⬇️</div>
    </div>
    <div id="canvasContainer"></div>
    <script src="notebook.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </body>
</html>
