<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lipi Web</title>
    <style>
      body {
        background-color: #f0f0f0;
      }
      .notebookSize {
        display: flex;
        gap: 5px;
      }
      .notebookSize > div {
        font-size: 1.25rem;
        padding: 2px;
        margin: 2px;
      }
      #notebookList {
        background-color: gray;
        display: flex;
        flex-direction: column;
        padding: 10px;
        margin-top: 10px;
        gap: 10px;
      }
      button {
        cursor: pointer;
      }
      .notebook:hover {
        color: aqua;
        cursor: pointer;
      }
      .notebookRow {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .notebookRow > button {
        font-size: 14px;
        padding: 3px 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Notebooks</h1>
    <div class="notebookSize">
      <div id="sizeA4">A4</div>
      <div id="sizeLandscape">Landscape</div>
    </div>
    <input type="text" id="newNotebookName" placeholder="Notebook name" />
    <button class="create" id="createNotebookWhite">White 📝</button>
    <button class="create" id="createNotebookLine">Line 📝</button>
    <button class="create" id="createNotebookGrid">Grid 📝</button>
    <button class="create" id="createNotebookDot">Dot 📝</button>
    <button class="create" id="createNotebookHanzi">Hanzi 📝</button>
    <div id="notebookList">
      <!-- <div class="notebookRow">
        <div class="notebook">📄 Name</div>
        <button class="copyBtn">📋</button>
        <button class="deleteBtn">🗑️</button>
      </div> -->
    </div>
    <script src="script.js"></script>
  </body>
</html>
