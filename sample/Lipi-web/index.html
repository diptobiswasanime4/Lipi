<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lipi</title>
    <style>
      body {
        background-color: #f0f0f0;
      }
      #notebookList {
        background-color: gray;
        display: flex;
        flex-direction: column;
        padding: 10px;
        margin-top: 10px;
        gap: 10px;
      }
      button {
        cursor: pointer;
      }
      .notebook:hover {
        color: aqua;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Notebooks</h1>
    <input type="text" id="newNotebookName" placeholder="Notebook name" />
    <button class="create" id="createNotebookWhite">White 📝</button>
    <button class="create" id="createNotebookLine">Line 📝</button>
    <button class="create" id="createNotebookGrid">Grid 📝</button>
    <button class="create" id="createNotebookDot">Dot 📝</button>
    <button class="create" id="createNotebookHanzi">Hanzi 📝</button>
    <div id="notebookList"></div>
    <script src="script.js"></script>
  </body>
</html>
